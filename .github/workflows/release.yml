name: Release

# Builds the BOLT desktop client from the private davidreis97/bolt repo
# (bolt-desktop/) and publishes installers here, where the app's
# auto-updater looks for them. The release is created as a draft and only
# published once every platform has uploaded, so clients never see a
# partial release.
#
# Since the native game (bolt docs/RUNBOOK.md, "Desktop app") the desktop
# bundles code from the whole repo: the game worker is built from
# core/, shared/ and bolt/src, and the Windows and macOS builds carry the
# bolt-native Node addon (Rust, renderer/). So the full repo is checked out,
# the root workspace installed, core/shared built, and Windows and macOS
# compile the addon. macOS builds are Apple silicon (arm64) only, the
# runner's architecture: bolt-desktop/package.json no longer targets x64.
#
# Run with: gh workflow run release.yml -R davidreis97/bolt-desktop-releases [-f ref=<branch|tag|sha>] [-f publish=false]
#
# publish=false leaves the release as a draft: installers can be downloaded
# for testing, and the auto-updater (which only sees published releases)
# does not offer it to anyone.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref of davidreis97/bolt to build
        default: main
        required: true
      publish:
        description: Publish when every platform has uploaded (false keeps a draft for testing)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: davidreis97/bolt
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.BOLT_DEPLOY_KEY }}
          sparse-checkout: bolt-desktop/package.json
          sparse-checkout-cone-mode: false

      - id: version
        run: echo "tag=v$(node -p "require('./bolt-desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            false)
              echo "::error::$TAG is already published. Bump the version in bolt-desktop/package.json."
              exit 1 ;;
            true)
              echo "Reusing existing draft $TAG" ;;
            missing)
              gh release create "$TAG" --draft --title "$TAG" --target main \
                --notes "Built from davidreis97/bolt@${{ inputs.ref }}" ;;
          esac

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bolt-desktop
    env:
      # npm scripts use POSIX commands (`rm -rf`): run them in Git Bash on Windows too.
      npm_config_script_shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: davidreis97/bolt
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.BOLT_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bolt-desktop/package-lock.json

      # The game worker bundles core/, shared/, bolt/src and boltgame.js/src
      # (bolt-desktop/scripts/build-worker.mjs) from the root workspace.
      - name: Install and build the shared packages
        working-directory: .
        run: |
          npm ci
          npm run build -w @bolt/core
          npm run build -w @bolt/shared

      # Windows and macOS: the native game's addon. renderer/rust-toolchain.toml
      # pins the toolchain; rustup installs it on first use.
      - name: Rust cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Build the bolt-native addon
        if: runner.os != 'Linux'
        working-directory: .
        run: npm run build:addon -w @bolt/render

      - run: npm ci

      - name: Build and upload to draft release
        shell: bash
        # Unset secrets are passed as empty strings, which electron-builder
        # treats as set (e.g. CSC_LINK="" resolves to the project dir).
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Without a Developer ID cert, ad-hoc sign the mac app. Otherwise it
          # keeps Electron's stock signature, which packaging invalidates, and
          # macOS reports the app as "damaged" with no way to open it.
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npm run release -- "${extra[@]}"
        env:
          # Optional macOS signing + notarization. Without these the mac
          # build is unsigned and macOS auto-update will not work.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
